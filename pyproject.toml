[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-scaffolding-skills"
version = "1.0.1"
description = "Select and create a skeleton for AI project creation. (AI 搭建项目根骨架的技能) Flow: define idea -> tier -> human confirm -> create -> root gate; no runtime dependencies."
readme = "README.md"
authors = [{name = "YDev26"}]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.urls]
Repository = "https://github.com/YDev26/ai-project-scaffolding-skills"
Issues = "https://github.com/YDev26/ai-project-scaffolding-skills/issues"

[project.scripts]
ai-project-scaffold = "standard:main"

[tool.setuptools]
py-modules = ["standard"]
packages = ["common", "tier_pipeline", "gate_pipeline", "scaffold_core"]
package-dir = {"" = "skills/ai-project-scaffolding/scripts"}
